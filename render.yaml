services:
  - type: web
    name: supply-chain-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AURA_NEO4J_URI
        sync: false
      - key: AURA_NEO4J_USERNAME
        sync: false
      - key: AURA_NEO4J_PASSWORD
        sync: false
      - key: AURA_NEO4J_DATABASE
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: APP_ENV
        sync: false
      - key: ROUTE_ESTIMATE_SERVICE_TOKEN
        sync: false
      - key: ROUTE_ESTIMATE_ALLOW_LOCAL_UNAUTHENTICATED
        sync: false
      - key: FREIGHTOS_TIMEOUT_SECONDS
        sync: false
      - key: FREIGHTOS_MAX_RETRIES
        sync: false
      - key: FREIGHTOS_CACHE_TTL_SECONDS
        sync: false
      - key: FREIGHTOS_HOURLY_REQUEST_LIMIT
        sync: false
      - key: FREIGHTOS_CIRCUIT_FAILURE_THRESHOLD
        sync: false
      - key: FREIGHTOS_CIRCUIT_OPEN_SECONDS
        sync: false
